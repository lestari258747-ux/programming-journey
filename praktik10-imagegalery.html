<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div.gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
    }
    div.gallery-item {
        margin: 5px;
        border: 1px solid #ccc;
        width: 180px;
    }
    div.gallery-item:hover {
        border: 1px solid #777;
    }
    div.gallery-item img {
        width: 100%;
        height: auto;
    }
    div.gallery-item div.desc {
        padding: 15px;
        text-align: center;
    }
    </style>
</head>
<body>
  <h2>Image Gallery</h2>

<div class="gallery">

<div class="gallery-item">
    <a target="_blank" href="kucing1.jpeg">
      <img src="kucing1.jpeg" alt="kucing" width="600" height="400">
    </a>
    <div class="desc">Brown Cat</div>
</div>

<div class="gallery-item">
    <a target="_blank" href="kucing2.jpeg">
      <img src="kucing2.jpeg" alt="kucing" width="600" height="400">
    </a>
    <div class="desc">White Cat</div>
</div>

<div class="gallery-item">
    <a target="_blank" href="kucing3.jpeg">
      <img src="kucing3.jpeg" alt="kucing" width="600" height="400">
    </a>
    <div class="desc">Orange Cat</div>
</div>

<div class="gallery-item">
    <a target="_blank" href="kucing4.jpeg">
      <img src="kucing4.jpeg" alt="kucing" width="600" height="400">
    </a>
    <div class="desc">Grey Cat</div>
</div>
</div>
</body>
</html>
