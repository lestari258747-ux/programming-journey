<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 200px;
            height: 200px;
        }
        div{
            width: 200px;
            height: 200px;
            position: absolute;
        }
        .satu{
            background-color: salmon;
        }
        .dua{
            background-color: lightgreen;
            top: 100px;
            left: 100px;
        }
        .tiga{
            background-color: royalblue;
            top: 200px;
            left: 200px;
        }
    </style>
</head>
<body>
    <div class="satu">
      <img src="cat.jpeg">
    </div>
    <div class="dua">
      <img src="catt.jpeg">
    </div>
    <div class="tiga">
      <img src="cattt.jpeg">
    </div>
</body>
</html>
